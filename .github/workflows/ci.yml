name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest
    env:
      # Keep the MongoDB binary outside node_modules so it can be cached.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Cache MongoDB binaries (mongodb-memory-server)
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test

  client:
    name: Client (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
