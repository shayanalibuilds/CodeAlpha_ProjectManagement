name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (install, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary on first run
      - name: Cache MongoDB test binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Jest + Supertest + mongodb-memory-server)
        run: npm test

  client:
    name: Client (install, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + jsx-a11y)
        run: npm run lint

      - name: Build (Vite)
        run: npm run build
